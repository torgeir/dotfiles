# prefix key
set -g prefix C-s
bind-key C-s send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000 # default 2000
set -g detach-on-destroy off # switch session
set -s escape-time 0

# send focus to editors
set -g focus-events on
# for keys that would otherwise be indistinguishable
set -g extended-keys on
# TODO docker no like
#set -g extended-keys-format csi-u

# toggle synchronize panes
bind-key a set-window-option synchronize-panes\; display-message " 󰂞  synchronize-panes: #{?pane_synchronized,on,off}"
# toggle monitor activity
bind-key A set-window-option monitor-activity\; display-message " 󰂞  monitor-activity: #{?monitor-activity,on,off}"
set -g visual-activity on

set -g mouse on

# vim all the things
setw -g mode-keys vi
bind-key c new-window -c "#{pane_current_path}"
bind-key C-c new-window -c "#{pane_current_path}"
bind-key C-x confirm-before -p "kill pane #P? (y/n)" kill-pane
bind-key C-d detach
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -N "join pane from window" @ choose-window 'join-pane -h -s "%%"'
bind-key -N "clear screen and history" C-l send-keys C-l \; clear-history

# -n means -T root, means in the root map
bind-key -n C-M-Left select-pane -L
bind-key -n C-M-Down select-pane -D
bind-key -n C-M-Up select-pane -U
bind-key -n C-M-Right select-pane -R

# split window movement like iterm using M-<arrows>
# debug with ^H in zsh (describe key briefly)
# and replace ^[ with \e
set -s user-keys[0] "\e[1;11D" # M-left
set -s user-keys[1] "\e[1;11B" # M-down
set -s user-keys[2] "\e[1;11A" # M-up
set -s user-keys[3] "\e[1;11C" # M-right
bind-key -n User0 select-pane -L
bind-key -n User1 select-pane -D
bind-key -n User2 select-pane -U
bind-key -n User3 select-pane -R

# tmux, -n binds without needing c-s
bind-key -n C-Left previous-window
bind-key -n C-Right next-window
bind-key C-p previous-window
bind-key C-n next-window

# lock
bind-key -N "lock pane" L if-shell -F '#{pane_input_off}' 'select-pane -e' 'select-pane -d'

# popups
bind-key -N "sessions" C-w display-popup -E -w 80% -h 70% 'name=$(tmux list-sessions -F "#{session_name}" -f "#{?session_attached,,1}" | fzf --reverse --ansi --print-query --preview "tmux capture-pane -ep -t {}" --preview-window right:60% | tail -1); [ -n "$name" ] && { tmux has-session -t="$name" 2>/dev/null || tmux new-session -d -s "$name"; tmux switch-client -t "$name"; }'
bind-key -N "sessions" -n C-Tab display-popup -E -w 80% -h 70% 'name=$(tmux list-sessions -F "#{session_name}" -f "#{?session_attached,,1}" | fzf --reverse --ansi --print-query --preview "tmux capture-pane -ep -t {}" --preview-window right:60% | tail -1); [ -n "$name" ] && { tmux has-session -t="$name" 2>/dev/null || tmux new-session -d -s "$name"; tmux switch-client -t "$name"; }'
bind-key -N "keybinds" C-b display-popup -E -w 80% -h 70% 'tmux list-keys -T prefix | sed "s/^bind-key *-T prefix *//" | sort | fzf --reverse --ansi'
bind-key -N "scratch" C-g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" 
bind-key -N "projects" C-p display-popup -E -w 60% -h 60% 'dir=$(zoxide query -l | fzf --reverse) && [ -n "$dir" ] && n=$(basename "$dir" | tr ".:" "__") && { tmux has-session -t "=$n" 2>/dev/null || tmux new-session -ds "$n" -c "$dir"; } && tmux switch-client -t "=$n"'

# windows
bind-key r rotate-window
bind-key - select-layout main-horizontal
bind-key + select-layout main-vertical
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500
bind-key -N "kill window" C-k confirm-before -p "kill window #W? (y/n)" kill-window

# rename pane based on folder or program
set-option -g status-interval 1
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{pane_current_command}}}"

# copy out of opencode in tmux in docker
set -g set-clipboard on
set -g allow-passthrough on

# copy paste
bind-key [ copy-mode
bind-key ] paste-buffer

# linux
# bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# mac
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# reload
bind C-r source-file ~/.tmux.conf \; display-message " 󰂞  tmux.conf reloaded"

# resize to window
setw -g aggressive-resize on

# terminal
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6#configuration-files
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# https://github.com/tmux/tmux/wiki/FAQ

# terminal title
set -g set-titles
set -g set-titles-string "#T"

# catppuccin mocha inspired
# run debug-colors to show them
fg=#cdd6f4
bg=#1e1e2e
grey=#313244
beige=#bac2de
white=#f5e0dc
red=#f38ba8
green=#a6e3a1
yellow=#f9e2af
blue=#89b4fa
orange=#fab387

set -g status-fg $fg
set -g status-bg $bg

set -g pane-border-style fg=$grey
set -g pane-active-border-style fg=$green

set -g message-style "fg=$red,bg=$bg,bold"

# window bars
setw -g window-status-format "#{?window_activity_flag,#[bg=$red]#[fg=$bg],#[bg=$grey]#[fg=$bg]} #I #{?window_bell_flag,󰂞  ,}#{?window_activity_flag,#[fg=$red],#[fg=$grey]}#[bg=colour0] #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-format "#[fg=$bg,bg=$green] #I #[fg=$green,bg=$bg] #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-bell-style bold
setw -g window-status-current-style bold
setw -g window-status-activity-style bold

# status bars
set -g status-left-length 0
set -g status-left ""
set -g status-right-length 100
set -g status-right "#[fg=$grey,bg=$bg] #[fg=$orange,bg=$bg] #[fg=$red,bg=$bg]#{?#{||:#{==:#T,#H},#{?#T,0,1}},#H,#T}#[fg=$grey,bg=$bg] | #[fg=$red,bg=$bg]#[fg=$grey,bg=$bg]#S#[fg=$grey,bg=$bg] | #[fg=$green,bg=$bg]%d. %b %R "

# locked panes
set -g pane-border-status top
set -g pane-border-format ' #{?pane_input_off,🔒 ,}#{pane_current_command} '
